<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gstall's Monster Truck</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.2rem;
      color: #ff9900;
    }

    .sound-btn {
      background: #333;
      color: #fff;
      border: 1px solid #666;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Responsive Canvas Container */
    .canvas-wrapper {
      width: 100%;
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    /* On-Screen Mobile D-Pad */
    .dpad-container {
      width: 100%;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dpad-row {
      display: flex;
      gap: 15px;
    }

    .dpad-btn {
      width: 60px;
      height: 60px;
      font-size: 22px;
      font-weight: bold;
      background-color: #2a2a2a;
      color: #ff9900;
      border: 2px solid #ff9900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      touch-action: none;
    }

    .dpad-btn:active, .dpad-btn.active {
      background-color: #ff9900;
      color: #1a1a1a;
    }

    @media (min-width: 768px) {
      /* Optional helper text on desktop */
      .desktop-hint {
        margin-top: 8px;
        font-size: 0.8rem;
        color: #888;
      }
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header-bar">
    <h1>Gstall's Monster Truck</h1>
    <button id="sound-toggle" class="sound-btn">🔊 Mute</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <!-- Touch Controls -->
  <div class="dpad-container">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn">◀</button>
      <button id="btn-down" class="dpad-btn">▼</button>
      <button id="btn-right" class="dpad-btn">▶</button>
    </div>
  </div>
  
  <div class="desktop-hint">Tip: Use Arrow Keys on desktop or On-Screen buttons on mobile.</div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Input states
  const keys = {
    ArrowUp: false,
    ArrowDown: false,
    ArrowLeft: false,
    ArrowRight: false
  };

  // Player Truck
  const truck = {
    x: 180,
    y: 480,
    width: 40,
    height: 70,
    speed: 4,
    distanceTravelled: 0,
    targetDistance: 60 // 60m track
  };

  let obstacles = [];
  let gameWon = false;
  let animationFrameId;

  // Sound Engine setup (Web Audio API)
  let audioCtx = null;
  let osc = null;
  let gainNode = null;
  let soundMuted = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(60, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(soundMuted ? 0 : 0.05, audioCtx.currentTime);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
  }

  function updateAudio() {
    if (!audioCtx || soundMuted) return;
    // Engine pitch rises as truck accelerates up
    const pitch = keys.ArrowUp ? 120 : (keys.ArrowDown ? 45 : 70);
    osc.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.1);
  }

  document.getElementById('sound-toggle').addEventListener('click', () => {
    soundMuted = !soundMuted;
    document.getElementById('sound-toggle').innerText = soundMuted ? '🔇 Unmute' : '🔊 Mute';
    if (gainNode && audioCtx) {
      gainNode.gain.setValueAtTime(soundMuted ? 0 : 0.05, audioCtx.currentTime);
    }
  });

  // Touch & Mouse Button Handler
  function bindTouchControl(buttonId, keyName) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;

    const startPress = (e) => {
      e.preventDefault();
      initAudio();
      keys[keyName] = true;
      btn.classList.add('active');
    };

    const endPress = (e) => {
      e.preventDefault();
      keys[keyName] = false;
      btn.classList.remove('active');
    };

    btn.addEventListener('touchstart', startPress, { passive: false });
    btn.addEventListener('touchend', endPress, { passive: false });
    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('mouseup', endPress);
    btn.addEventListener('mouseleave', endPress);
  }

  bindTouchControl('btn-up', 'ArrowUp');
  bindTouchControl('btn-down', 'ArrowDown');
  bindTouchControl('btn-left', 'ArrowLeft');
  bindTouchControl('btn-right', 'ArrowRight');

  // Keyboard Listeners (Desktop)
  window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) {
      initAudio();
      keys[e.key] = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) {
      keys[e.key] = false;
    }
  });

  // Obstacle Spawner
  function spawnObstacle() {
    if (obstacles.length < 7 && Math.random() < 0.03) {
      obstacles.push({
        x: Math.random() * (canvas.width - 80) + 40,
        y: -50,
        width: 35,
        height: 35,
        speed: 3 + Math.random() * 2
      });
    }
  }

  function update() {
    if (gameWon) return;

    updateAudio();

    // Movement
    if (keys.ArrowLeft && truck.x > 40) truck.x -= truck.speed;
    if (keys.ArrowRight && truck.x < canvas.width - 40 - truck.width) truck.x += truck.speed;
    if (keys.ArrowUp && truck.y > 50) {
      truck.y -= truck.speed * 0.5;
      truck.distanceTravelled += 0.05;
    }
    if (keys.ArrowDown && truck.y < canvas.height - 90) {
      truck.y += truck.speed * 0.5;
    }

    // Always slow forward track progress
    truck.distanceTravelled += 0.01;

    // Victory Condition
    if (truck.distanceTravelled >= truck.targetDistance) {
      gameWon = true;
    }

    // Move & Check Obstacles
    spawnObstacle();
    for (let i = 0; i < obstacles.length; i++) {
      let obs = obstacles[i];
      obs.y += obs.speed;

      // Collision box check
      if (
        truck.x < obs.x + obs.width &&
        truck.x + truck.width > obs.x &&
        truck.y < obs.y + obs.height &&
        truck.y + truck.height > obs.y
      ) {
        // Reset position on hit
        truck.x = 180;
        truck.y = 480;
        obstacles.splice(i, 1);
        break;
      }

      // Cleanup offscreen obstacles
      if (obs.y > canvas.height) {
        obstacles.splice(i, 1);
        i--;
      }
    }
  }

  function draw() {
    // Road & Grass
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#424242';
    ctx.fillRect(30, 0, canvas.width - 60, canvas.height);

    // Road dashed line
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw Obstacles
    ctx.fillStyle = '#b71c1c';
    obstacles.forEach(obs => {
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    });

    // Draw Monster Truck
    ctx.fillStyle = '#ff9900';
    ctx.fillRect(truck.x, truck.y, truck.width, truck.height);

    // Tires
    ctx.fillStyle = '#000000';
    ctx.fillRect(truck.x - 6, truck.y + 5, 8, 18);
    ctx.fillRect(truck.x + truck.width - 2, truck.y + 5, 8, 18);
    ctx.fillRect(truck.x - 6, truck.y + truck.height - 23, 8, 18);
    ctx.fillRect(truck.x + truck.width - 2, truck.y + truck.height - 23, 8, 18);

    // Progress Bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 150, 25);
    ctx.fillStyle = '#ff9900';
    const progress = Math.min(truck.distanceTravelled / truck.targetDistance, 1);
    ctx.fillRect(12, 12, 146 * progress, 21);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText(`${Math.floor(truck.distanceTravelled)}m / ${truck.targetDistance}m`, 55, 27);

    // Victory Overlay
    if (gameWon) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff9900';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('You made it!', canvas.width / 2, 260);

      ctx.fillStyle = '#ffffff';
      ctx.font = '16px Arial';
      ctx.fillText('The final coordinates are:', canvas.width / 2, 300);

      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('N42° 02.337 W88° 15.727', canvas.width / 2, 340);
    }
  }

  function gameLoop() {
    update();
    draw();
    animationFrameId = requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
